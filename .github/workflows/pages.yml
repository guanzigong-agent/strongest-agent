name: Publish 最强经纪人
on:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate and test
        run: |
          npm test
          npm run validate
      - uses: actions/configure-pages@v5
      - name: Prepare public game files
        run: |
          mkdir -p _site/docs
          cp index.html styles.css _site/
          cp -r src data _site/
          cp docs/data-sources.md _site/docs/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
